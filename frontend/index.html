<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1><span>Music</span> Assistant</h1>

        <p>Gestiona tu colección de canciones</p>

        <form id="song-form">
            <input type="text" id="title" placeholder="Cancion">
            <input type="text" id="artist" placeholder="Artista o banda">
            <button type="submit" class="song-add">Agregar</button>
        </form>

        <div class="songs-container" id="songs-container">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
